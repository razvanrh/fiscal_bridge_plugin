
// build.gradle (Groovy) for the Android plugin module

plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group = "ro.masipos.fiscal"
version = "1.0-SNAPSHOT"

flutter {
    // path to the package root (two levels above /android)
    source = '../..'
}


android {
    namespace "ro.masipos.fiscal"

    // keep in sync with example; AGP 8.x works well with 34
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles "consumer-rules.pro"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // include any .jar in libs (avoid case-sensitive typos)
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.0.0"
}

